# Free Supabase projects pause after ~7 days without traffic.
# This pings the database every 3 days so the shop site never goes blank.
# Add repo secrets: SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets > Actions).
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "pinged"
